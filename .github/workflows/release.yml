# A tag like v1.0.0 builds the program and its installer, and publishes them as a GitHub release.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build
        shell: pwsh
        run: ./build-release.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem installer/output/* | ForEach-Object FullName) --title $env:GITHUB_REF_NAME --generate-notes
